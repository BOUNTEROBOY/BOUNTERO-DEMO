<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bountero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #F7E37D;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px;
        }

        .wordmark {
            width: 805px;
            max-width: 90vw;
            height: auto;
            opacity: 0;
            transform: translateY(30px);
            animation: riseIn 0.8s ease-out forwards;
            z-index: 3;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-container {
            position: relative;
            width: 600px;
            max-width: 80vw;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .cta-oval {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 12px solid #000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .cta-container:hover .cta-oval {
            transform: scale(1.05);
        }

        .cta-text {
            position: relative;
            width: 280px;
            height: auto;
            opacity: 0;
            animation: fadeFlicker 2s forwards;
            animation-delay: 2s;
            pointer-events: none;
        }

        @keyframes fadeFlicker {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            20% {
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            40% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            60% {
                opacity: 0.4;
            }
            70% {
                opacity: 0.9;
            }
            80% {
                opacity: 1;
            }
            85% {
                opacity: 0.8;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        .landscape {
            width: 100%;
            max-width: 1200px;
            height: auto;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            body {
                padding: 40px 15px 30px;
            }

            .wordmark {
                width: 600px;
            }
            
            .cta-container {
                width: 480px;
                height: 192px;
            }

            .cta-text {
                width: 220px;
            }

            .landscape {
                max-width: 900px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 10px 20px;
            }

            .wordmark {
                width: 450px;
            }
            
            .cta-container {
                width: 360px;
                height: 144px;
            }

            .cta-oval {
                border: 8px solid #000;
            }

            .cta-text {
                width: 165px;
            }

            .landscape {
                max-width: 700px;
            }
        }

        @media (max-width: 480px) {
            .wordmark {
                width: 85vw;
            }
            
            .cta-container {
                width: 75vw;
                height: 30vw;
            }

            .cta-oval {
                border: 6px solid #000;
            }

            .cta-text {
                width: 35vw;
            }

            .landscape {
                max-width: 90vw;
            }
        }
    </style>
</head>
<body>
    <img src="Wordmark.png" alt="Bountero" class="wordmark">
    
    <div class="cta-container">
        <div class="cta-oval"></div>
        <img src="book_demo.png" alt="Book Demo" class="cta-text">
    </div>
    
    <img src="Landscape.png" alt="Landscape" class="landscape">
</body>
</html>
