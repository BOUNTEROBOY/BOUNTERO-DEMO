<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bountero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #F7E37D;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 80px;
            gap: 40px;
        }

        .wordmark {
            width: 966px;
            max-width: 85vw;
            height: auto;
            opacity: 0;
            transform: translateY(30px);
            animation: riseIn 0.8s ease-out forwards;
            filter: drop-shadow(8px 8px 4px rgba(0, 0, 0, 0.4));
            z-index: 3;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-container {
            position: relative;
            width: 280px;
            height: 112px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            margin-top: 20px;
        }

        .cta-oval {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            border: 12px solid #000;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .cta-container:hover .cta-oval {
            transform: scale(1.05);
        }

        .cta-container:hover .cta-text {
            transform: scale(1.05);
        }

        .cta-text {
            position: relative;
            width: 180px;
            height: auto;
            opacity: 0;
            animation: fadeFlicker 2s forwards;
            animation-delay: 2s;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        @keyframes fadeFlicker {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            20% {
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            40% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            60% {
                opacity: 0.4;
            }
            70% {
                opacity: 0.9;
            }
            80% {
                opacity: 1;
            }
            85% {
                opacity: 0.8;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        .landscape {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 1100px;
            height: auto;
            display: block;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            .wordmark {
                width: 720px;
            }
            
            .cta-container {
                width: 240px;
                height: 96px;
            }

            .cta-text {
                width: 150px;
            }

            .landscape {
                width: 80%;
                bottom: 50px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 60px;
                gap: 30px;
            }

            .wordmark {
                width: 540px;
            }
            
            .cta-container {
                width: 200px;
                height: 80px;
                margin-top: 10px;
            }

            .cta-oval {
                border: 10px solid #000;
            }

            .cta-text {
                width: 125px;
            }

            .landscape {
                width: 75%;
                bottom: 40px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding-top: 40px;
                gap: 20px;
            }

            .wordmark {
                width: 80vw;
            }
            
            .cta-container {
                width: 35vw;
                height: 14vw;
                margin-top: 5px;
            }

            .cta-oval {
                border: 8px solid #000;
            }

            .cta-text {
                width: 22vw;
            }

            .landscape {
                width: 70vw;
                bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <img src="Wordmark.png" alt="Bountero" class="wordmark">
    
    <div class="cta-container">
        <div class="cta-oval"></div>
        <img src="book_demo.png" alt="Book Demo" class="cta-text">
    </div>
    
    <img src="Landscape.png" alt="Landscape" class="landscape">
</body>
</html>
