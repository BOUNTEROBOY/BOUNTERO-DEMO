<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bountero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #FFE376;
        }

        .wordmark {
            position: absolute;
            top: 7%;
            left: 50%;
            transform: translateX(-50%);
            width: 1159px;
            max-width: 85vw;
            height: auto;
            opacity: 0;
            animation: riseIn 0.8s ease-out forwards;
            filter: drop-shadow(8px 8px 4px rgba(0, 0, 0, 0.4));
            z-index: 3;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .cta-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 112px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            cursor: pointer;
        }

        .cta-oval {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            border: 12px solid #000;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .cta-container:hover .cta-oval {
            transform: scale(1.05);
        }

        .cta-container:hover .cta-text {
            transform: scale(1.05);
        }

        .cta-text {
            position: relative;
            width: 500px;
            height: auto;
            opacity: 0;
            animation: gentleFlicker 3.5s ease-in-out forwards;
            animation-delay: 2s;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        @keyframes gentleFlicker {
            0% {
                opacity: 0;
            }
            15% {
                opacity: 0.5;
            }
            25% {
                opacity: 0.7;
            }
            35% {
                opacity: 0.85;
            }
            45% {
                opacity: 0.75;
            }
            55% {
                opacity: 0.9;
            }
            65% {
                opacity: 0.95;
            }
            75% {
                opacity: 0.88;
            }
            85% {
                opacity: 0.97;
            }
            95% {
                opacity: 0.93;
            }
            100% {
                opacity: 1;
            }
        }

        .landscape {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            max-width: 880px;
            height: auto;
            display: block;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            .wordmark {
                width: 864px;
                top: 8%;
            }
            
            .cta-container {
                width: 240px;
                height: 96px;
            }

            .cta-text {
                width: 230px;
            }

            .landscape {
                width: 64%;
                max-width: 750px;
            }
        }

        @media (max-width: 768px) {
            .wordmark {
                width: 648px;
                top: 10%;
            }
            
            .cta-container {
                width: 200px;
                height: 80px;
            }

            .cta-oval {
                border: 10px solid #000;
            }

            .cta-text {
                width: 190px;
            }

            .landscape {
                width: 60%;
                max-width: 600px;
                bottom: 10%;
            }
        }

        @media (max-width: 480px) {
            .wordmark {
                width: 80vw;
                top: 12%;
            }
            
            .cta-container {
                width: 35vw;
                height: 14vw;
            }

            .cta-oval {
                border: 8px solid #000;
            }

            .cta-text {
                width: 30vw;
            }

            .landscape {
                width: 55vw;
                bottom: 12%;
            }
        }
    </style>
</head>
<body>
    <img src="Wordmark.png" alt="Bountero" class="wordmark">
    
    <div class="cta-container">
        <div class="cta-oval"></div>
        <img src="book_demo.png" alt="Book Demo" class="cta-text">
    </div>
    
    <img src="Landscape.png" alt="Landscape" class="landscape">
</body>
</html>
