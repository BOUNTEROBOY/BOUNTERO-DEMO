<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bountero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #F7E37D;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px;
        }

        .wordmark {
            width: 910px;
            max-width: 90vw;
            height: auto;
            opacity: 0;
            transform: translateY(30px);
            animation: riseIn 0.8s ease-out forwards;
            z-index: 3;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-button {
            width: 575px;
            max-width: 80vw;
            height: auto;
            opacity: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            animation: fadeFlicker 2s forwards;
            animation-delay: 2s;
            z-index: 2;
        }

        .cta-button:hover {
            transform: scale(1.05);
        }

        @keyframes fadeFlicker {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            20% {
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            40% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            60% {
                opacity: 0.4;
            }
            70% {
                opacity: 0.9;
            }
            80% {
                opacity: 1;
            }
            85% {
                opacity: 0.8;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        .landscape {
            width: 585px;
            max-width: 60vw;
            height: auto;
            z-index: 1;
        }

        @media (max-width: 1024px) {
            body {
                padding: 40px 15px 30px;
            }

            .wordmark {
                width: 700px;
            }
            
            .cta-button {
                width: 450px;
            }

            .landscape {
                width: 450px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 10px 20px;
            }

            .wordmark {
                width: 500px;
            }
            
            .cta-button {
                width: 320px;
            }

            .landscape {
                width: 320px;
            }
        }

        @media (max-width: 480px) {
            .wordmark {
                width: 85vw;
            }
            
            .cta-button {
                width: 70vw;
            }

            .landscape {
                width: 55vw;
            }
        }
    </style>
</head>
<body>
    <img src="Wordmark.png" alt="Bountero" class="wordmark">
    <img src="BookDemoButton.png" alt="Book Demo" class="cta-button">
    <img src="Landscape.png" alt="Landscape" class="landscape">
</body>
</html>
