<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNTERO | Bounties for outbound</title>
    <style>
        body {
            background-color: #F7E37D; /* Exact match to your Canva yellow */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px; /* Limits the size so it doesn't cut off */
        }

        .wordmark {
            width: 90%;
            height: auto;
            margin-bottom: -20px; /* Pulls landscape closer to the wordmark */
        }

        .landscape {
            width: 100%;
            height: auto;
        }

        .book-demo {
            margin-top: 20px;
            width: 250px; /* Adjust size of your button asset */
            cursor: pointer;
            transition: transform 0.2s;
        }

        .book-demo:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Wordmark.png" class="wordmark" alt="Bountero">
        
        <img src="Landscape.png" class="landscape" alt="Horizon">

        <a href="YOUR_CALENDLY_LINK">
            <img src="book_demo.png" class="book-demo" alt="Book Demo">
        </a>
    </div>
</body>
</html>
