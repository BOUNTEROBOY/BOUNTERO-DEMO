<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bountero | Bounties for outbound</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #F7E37D;
        }

        .landscape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .wordmark {
            max-width: 600px;
            height: auto;
            opacity: 0;
            transform: translateY(30px);
            animation: riseIn 0.8s ease-out forwards;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-button {
            opacity: 0;
            max-width: 300px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            animation: fadeFlicker 2s forwards;
            animation-delay: 2s;
        }

        .cta-button:hover {
            transform: scale(1.05);
        }

        @keyframes fadeFlicker {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            20% {
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            40% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.8;
            }
            60% {
                opacity: 0.4;
            }
            70% {
                opacity: 0.9;
            }
            80% {
                opacity: 1;
            }
            85% {
                opacity: 0.8;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .wordmark {
                max-width: 80%;
            }
            
            .cta-button {
                max-width: 200px;
            }
            
            .content {
                gap: 40px;
            }
        }
    </style>
</head>
<body>
    <img src="Landscape.png" alt="Landscape" class="landscape">
    
    <div class="content">
        <img src="Wordmark.png" alt="Bountero" class="wordmark">
        <img src="BookDemoButton.png" alt="Book Demo" class="cta-button">
    </div>
</body>
</html>
